:root{
  --bg:#FFFFFF; --text:#14161A; --text-muted:#5B6168;
  --accent:#16345E; --border:rgba(20,22,26,0.14);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0B0D10; --text:#F2F1ED; --text-muted:#9AA0A6; --accent:#5C8CC4; --border:rgba(242,241,237,0.16); }
}
:root[data-theme="dark"]{ --bg:#0B0D10; --text:#F2F1ED; --text-muted:#9AA0A6; --accent:#5C8CC4; --border:rgba(242,241,237,0.16); }
:root[data-theme="light"]{ --bg:#FFFFFF; --text:#14161A; --text-muted:#5B6168; --accent:#16345E; --border:rgba(20,22,26,0.14); }

*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Archivo',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
::selection{background:var(--accent);color:#fff;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;}
.mark{width:clamp(84px,14vw,124px);height:auto;color:var(--accent);margin-bottom:30px;}
.wordmark-lg{font-family:'Caslon Text',serif;font-weight:700;font-size:clamp(2rem,6vw,3.4rem);letter-spacing:0.12em;text-transform:uppercase;color:var(--text);margin:0;}
.subline{font-family:'Plex Mono',monospace;font-size:0.78rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--text-muted);margin:20px 0 0;}
.divider{width:40px;height:1px;background:var(--border);margin:44px 0;}
.coming-soon{font-family:'Plex Mono',monospace;font-size:0.78rem;letter-spacing:0.32em;text-transform:uppercase;color:var(--accent);margin:0 0 26px;}
.email-link{font-family:'Plex Mono',monospace;font-size:clamp(1rem,2.2vw,1.3rem);color:var(--accent);text-decoration:none;border-bottom:2px solid var(--accent);padding-bottom:4px;}
.email-link:hover{opacity:0.7;}
</style>
